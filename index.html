<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>하이탑부동산 · 계약문자 생성기</title>
  <meta name="theme-color" content="#d4af37" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="계약문자" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              950: '#060d21',
              900: '#0b1227',
              800: '#141b2f',
              700: '#181f34',
              600: '#22293e',
              500: '#2d344a',
              400: '#32384f',
            },
            gold: {
              DEFAULT: '#d4af37',
              light: '#f2ca50',
              dim: '#e9c349',
            },
            surface: '#dbe1fe',
            muted: '#d0c5af',
          },
          fontFamily: { manrope: ['Manrope', 'sans-serif'] },
          borderRadius: { sm: '2px', DEFAULT: '4px', md: '4px', lg: '6px' },
        },
      },
    };
  </script>
  <style>
    * { font-family: 'Manrope', sans-serif; box-sizing: border-box; }
    body { background: #0b1227; color: #dbe1fe; min-height: 100vh; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b1227; }
    ::-webkit-scrollbar-thumb { background: #2d344a; border-radius: 3px; }

    /* input / select base */
    .field {
      background: #060d21;
      border: 1px solid #2d344a;
      border-radius: 4px;
      color: #dbe1fe;
      padding: 10px 14px;
      width: 100%;
      font-size: 15px;
      transition: border-color .2s;
      outline: none;
    }
    .field:focus { border-color: #d4af37; }
    .field::placeholder { color: #4d4635; }

    select.field option { background: #181f34; }

    /* label */
    .label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #d0c5af;
      margin-bottom: 6px;
    }

    /* gold button */
    .btn-gold {
      background: #d4af37;
      color: #241a00;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .05em;
      padding: 12px 28px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn-gold:hover { background: #f2ca50; transform: translateY(-1px); }
    .btn-gold:active { transform: translateY(0); }

    /* ghost button */
    .btn-ghost {
      background: transparent;
      color: #d4af37;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .05em;
      padding: 11px 24px;
      border-radius: 4px;
      border: 1px solid #d4af37;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-ghost:hover { background: rgba(212,175,55,.08); }

    /* card */
    .card {
      background: #141b2f;
      border: 1px solid #22293e;
      border-radius: 4px;
      padding: 24px;
    }

    /* toggle */
    .toggle-track {
      width: 44px; height: 24px;
      border-radius: 12px;
      background: #2d344a;
      position: relative;
      cursor: pointer;
      transition: background .2s;
      flex-shrink: 0;
    }
    .toggle-track.on { background: #d4af37; }
    .toggle-thumb {
      width: 18px; height: 18px;
      border-radius: 9px;
      background: #dbe1fe;
      position: absolute;
      top: 3px; left: 3px;
      transition: left .2s;
    }
    .toggle-track.on .toggle-thumb { left: 23px; background: #241a00; }

    /* step indicator */
    .step-dot {
      width: 32px; height: 32px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .step-dot.active { background: #d4af37; color: #241a00; }
    .step-dot.done { background: #22293e; color: #d4af37; border: 1px solid #d4af37; }
    .step-dot.idle { background: #22293e; color: #4d4635; }

    /* checkbox */
    .chk { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .chk input[type=checkbox] { display: none; }
    .chk-box {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 1px solid #4d4635;
      border-radius: 2px;
      background: #060d21;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
      transition: border-color .2s, background .2s;
    }
    .chk input:checked + .chk-box { background: #d4af37; border-color: #d4af37; }
    .chk-mark { width: 10px; height: 10px; fill: #241a00; display: none; }
    .chk input:checked + .chk-box .chk-mark { display: block; }
    .chk-label { font-size: 14px; color: #dbe1fe; line-height: 1.5; }

    /* messenger bubble */
    .bubble {
      background: #22293e;
      border: 1px solid #2d344a;
      border-radius: 4px 18px 18px 18px;
      padding: 16px 18px;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      color: #dbe1fe;
      resize: vertical;
      min-height: 400px;
      width: 100%;
      outline: none;
    }
    .bubble:focus { border-color: #d4af37; }

    /* radio pill */
    .radio-pill { display: flex; gap: 0; }
    .radio-pill label {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #2d344a;
      background: #060d21;
      color: #d0c5af;
      transition: background .15s, color .15s, border-color .15s;
    }
    .radio-pill label:first-child { border-radius: 4px 0 0 4px; }
    .radio-pill label:last-child { border-radius: 0 4px 4px 0; }
    .radio-pill input[type=radio] { display: none; }
    .radio-pill input:checked + label { background: #d4af37; color: #241a00; border-color: #d4af37; }

    /* divider */
    .divider { border: none; border-top: 1px solid #22293e; margin: 20px 0; }

    /* copy toast */
    #toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #d4af37; color: #241a00;
      font-weight: 700; font-size: 14px;
      padding: 12px 28px; border-radius: 4px;
      transition: transform .3s ease;
      z-index: 999;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── 모바일 최적화 ── */
    @media (max-width: 600px) {
      /* iOS 줌 방지: input 폰트 16px 이상 */
      .field { font-size: 16px; padding: 13px 14px; }

      /* 터치 타겟 최소 44px */
      .btn-gold, .btn-ghost {
        min-height: 48px;
        padding: 14px 20px;
        font-size: 15px;
        width: 100%;
        justify-content: center;
      }

      /* 버튼 행: 세로 스택 */
      .btn-row {
        flex-direction: column !important;
        gap: 10px !important;
      }
      .btn-row .btn-ghost { order: 2; }
      .btn-row .btn-gold  { order: 1; }

      /* 카드 패딩 축소 */
      .card { padding: 16px; }

      /* radio pill 글씨 */
      .radio-pill label { font-size: 14px; padding: 11px 0; }

      /* 체크박스 터치 영역 */
      .chk { padding: 6px 0; }
      .chk-box { width: 22px; height: 22px; }

      /* 말풍선 */
      .bubble { font-size: 13px; min-height: 320px; }

      /* 헤더 */
      header { padding: 0; }

      /* safe area (iPhone 노치/홈바) */
      body { padding-bottom: env(safe-area-inset-bottom); }
      #toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
      main { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header style="border-bottom:1px solid #22293e; background:#060d21; position:sticky; top:0; z-index:50;">
  <div style="max-width:760px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between;">
    <div>
      <div style="font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#d4af37;margin-bottom:2px;">REALTY</div>
      <div id="hd-name" onclick="goStep(1)" style="font-size:18px;font-weight:700;color:#dbe1fe;cursor:pointer;" title="처음으로">-</div>
      <div id="hd-title" style="font-size:12px;color:#d0c5af;margin-top:1px;">계약문자 생성기</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="hd-phone" style="font-size:12px;color:#4d4635;"></div>
      <button onclick="openSettings()"
        title="부동산 정보 설정"
        style="background:transparent;border:1px solid #2d344a;color:#d0c5af;font-size:12px;
               padding:5px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;">
        ⚙ <span style="font-size:11px;font-weight:600;letter-spacing:.03em;">설정변경</span>
      </button>
      <button id="install-btn" onclick="installApp()"
        style="display:none;background:rgba(212,175,55,.15);border:1px solid #d4af37;color:#d4af37;
               font-size:11px;font-weight:700;padding:6px 12px;border-radius:4px;cursor:pointer;
               letter-spacing:.05em;white-space:nowrap;">
        📱 앱 설치
      </button>
    </div>
  </div>
</header>

<!-- 설정 모달 -->
<div id="settings-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center;padding:24px;">
  <div style="background:#181f34;border:1px solid #d4af37;border-radius:6px;padding:28px;width:100%;max-width:420px;position:relative;">
    <div style="font-size:16px;font-weight:700;color:#d4af37;margin-bottom:20px;">⚙ 부동산 정보 설정</div>
    <div style="margin-bottom:14px;">
      <label class="label">부동산 이름</label>
      <input class="field" id="set-name" type="text" placeholder="예: 하이탑부동산" />
    </div>
    <div style="margin-bottom:24px;">
      <label class="label">전화번호</label>
      <input class="field" id="set-phone" type="tel" placeholder="예: 031-949-8969" />
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-gold" style="flex:1;" onclick="saveAgencySettings()">저장</button>
      <button class="btn-ghost" style="flex:1;" onclick="closeSettings()">취소</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<main style="max-width:760px; margin:0 auto; padding:32px 24px 120px;">

  <!-- STEP INDICATOR -->
  <div id="step-indicator" style="display:flex;align-items:center;gap:0;margin-bottom:32px;"></div>

  <!-- STEPS -->
  <div id="step-1" class="step-panel"></div>
  <div id="step-2" class="step-panel" style="display:none"></div>
  <div id="step-3" class="step-panel" style="display:none"></div>
  <div id="step-4" class="step-panel" style="display:none"></div>

</main>

<!-- TOAST -->
<div id="toast">✓ 문자가 복사되었습니다</div>

<script>
/* =========================================================
   STATE
========================================================= */
const state = {
  step: 1,
  complex: '',
  buildingName: '',   // 건물명 (일반 오피스텔/아파트)
  buildingDong: '',   // 동
  buildingHo: '',     // 호수
  contractType: '전세',
  deposit: '',
  monthlyRent: '',
  monthlyType: '후불',
  vat: '별도',
  moveInDate: '',
  contractPeriod: '24',
  customPeriod: '',
  contractMoney: '',
  todayDeposit: '',
  oftUse: '주거용',
  coAgent: false,
  coAgentName: '',
  clausePet: true,
  clauseCondition: true,
  clauseBreak: true,
  landlordBank: '',
  landlordAccount: '',
  landlordName: '',
};

/* persist / load */
function save() { localStorage.setItem('haitop_state', JSON.stringify(state)); }
function load() {
  const s = localStorage.getItem('haitop_state');
  if (s) Object.assign(state, JSON.parse(s));
}
load();

/* ── 부동산 정보 (별도 저장, 초기화해도 유지) ── */
const agency = { name: '하이탑부동산', phone: '031-949-8969' };
function loadAgency() {
  const a = localStorage.getItem('haitop_agency');
  if (a) Object.assign(agency, JSON.parse(a));
}
function saveAgency() { localStorage.setItem('haitop_agency', JSON.stringify(agency)); }
loadAgency();

/* =========================================================
   UTILS
========================================================= */
const COMPLEX_LIST = [
  { label: '힐스테이트더운정 (아파트)', value: 'hillstate_apt', type: 'apt', fixed: true },
  { label: '힐스테이트더운정 (오피스텔)', value: 'hillstate_oft', type: 'oft', fixed: true },
  { label: '오피스텔', value: 'oft', type: 'oft', fixed: false },
  { label: '아파트', value: 'apt', type: 'apt', fixed: false },
];

function isFixedComplex() {
  const c = COMPLEX_LIST.find(x => x.value === state.complex);
  return c && c.fixed;
}

function isOft() {
  const c = COMPLEX_LIST.find(x => x.value === state.complex);
  return c && c.type === 'oft';
}
function isBusinessOft() {
  return isOft() && state.oftUse === '업무용';
}
/* 부가세 표시 조건: 업무용 오피스텔 월세일 때만 */
function showVat() {
  return state.contractType === '월세' && isBusinessOft();
}

/* 숫자 → 한국어 금액 */
function numToKorean(n) {
  if (!n || isNaN(n)) return '';
  const units = ['', '만', '억', '조'];
  let num = Math.abs(parseInt(n));
  if (num === 0) return '영';
  const ones = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const tens = ['', '십', '이십', '삼십', '사십', '오십', '육십', '칠십', '팔십', '구십'];
  const hundreds = ['', '백', '이백', '삼백', '사백', '오백', '육백', '칠백', '팔백', '구백'];
  const thousands = ['', '천', '이천', '삼천', '사천', '오천', '육천', '칠천', '팔천', '구천'];

  function block(b) {
    const t = Math.floor(b / 1000) % 10;
    const h = Math.floor(b / 100) % 10;
    const ten = Math.floor(b / 10) % 10;
    const o = b % 10;
    return (t ? thousands[t] : '') + (h ? hundreds[h] : '') + (ten ? tens[ten] : '') + (o ? ones[o] : '');
  }

  let result = '';
  const parts = [];
  let tmp = num;
  for (let i = 0; tmp > 0; i++) {
    const b = tmp % 10000;
    if (b > 0) parts.unshift({ val: b, unit: units[i] });
    tmp = Math.floor(tmp / 10000);
  }
  result = parts.map(p => block(p.val) + p.unit).join('');

  // 간단 표기: 만단위까지
  return result;
}

function formatMoney(raw) {
  if (!raw) return '';
  const n = parseInt(raw.replace(/,/g, ''));
  if (isNaN(n)) return '';
  const kor = numToKorean(n);
  const fmt = n.toLocaleString('ko-KR');
  return `금 ${kor}원 정(${fmt}원)`;
}

function fmtNum(raw) {
  if (!raw) return '';
  const n = parseInt(raw.replace(/,/g, ''));
  if (isNaN(n)) return '';
  return n.toLocaleString('ko-KR');
}

function parseNum(s) {
  if (!s) return 0;
  return parseInt(String(s).replace(/,/g, '')) || 0;
}

/* 날짜 포맷 */
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${y}년 ${parseInt(m)}월 ${parseInt(day)}일`;
}

/* 잔금일 계산: 이사 예정일 */
function calcBalance() {
  const deposit = parseNum(state.deposit);
  const today = parseNum(state.todayDeposit);
  const total = parseNum(state.contractMoney);
  const balance = total - today;
  return { balance, total };
}

/* 계약 기간 */
function getPeriod() {
  if (state.contractPeriod === '직접') return state.customPeriod + '개월';
  return state.contractPeriod + '개월';
}

/* 단지명 */
function getComplexLabel() {
  const c = COMPLEX_LIST.find(x => x.value === state.complex);
  return c ? c.label : '';
}

/* =========================================================
   TEXT GENERATION
========================================================= */
function generateText() {
  const complexLabel = getComplexLabel();
  const bldgName = !isFixedComplex() && state.buildingName ? ` ${state.buildingName}` : '';
  const bldgDong = state.buildingDong ? ` ${state.buildingDong}동` : '';
  const bldgHo   = state.buildingHo   ? ` ${state.buildingHo}호`   : '';
  const bldg = `${bldgName}${bldgDong}${bldgHo}`;
  const isBizOft = isBusinessOft();
  const { balance } = calcBalance();
  const deposit = parseNum(state.deposit);
  const contractMoney = parseNum(state.contractMoney);
  const todayDeposit = parseNum(state.todayDeposit);

  const depositLine = formatMoney(String(deposit));
  const monthlyRentLine = state.contractType === '월세' ? formatMoney(state.monthlyRent) : '';
  const contractMoneyLine = formatMoney(String(contractMoney));
  const todayLine = formatMoney(String(todayDeposit));
  const balanceLine = formatMoney(String(balance));

  const coName = state.coAgent && state.coAgentName ? state.coAgentName : '';
  const agName = agency.name;
  const agPhone = agency.phone;

  let lines = [];

  lines.push(`안녕하세요. ${agName}(${agPhone})입니다.`);
  if (coName) {
    lines.push(`${agName}과 ${coName}이 진행하는 공동중개계약입니다.`);
  }
  lines.push(`[${complexLabel}${bldg} ${state.contractType} 계약내용]`);
  lines.push(``);
  lines.push(`■ 계약 조건`);

  if (state.contractType === '전세') {
    lines.push(`· 보증금: ${depositLine}`);
  } else {
    lines.push(`· 보증금: ${depositLine}`);
    const typeStr = state.monthlyType === '선불' ? ' / 선불' : ' / 후불';
    if (isBizOft) {
      const vatStr = state.vat === '별도' ? ' (부가세 별도)' : ' (부가세 포함)';
      lines.push(`· 월세: ${monthlyRentLine}${vatStr}${typeStr}`);
    } else {
      lines.push(`· 월세: ${monthlyRentLine}${typeStr}`);
    }
  }

  lines.push(`· 입주 예정일: ${fmtDate(state.moveInDate)}`);
  lines.push(`· 계약 기간: ${getPeriod()}`);
  lines.push(``);
  lines.push(`■ 계약금`);
  lines.push(`· 전체계약금: ${contractMoneyLine}`);
  lines.push(`· 금일계약금: ${todayLine}`);
  if (balance > 0) {
    lines.push(`· 나머지 계약금: ${balanceLine} (계약서 작성시 입금하기로 한다.)`);
  }
  lines.push(``);
  lines.push(`■ 임대인 계좌`);
  lines.push(`· 은행: ${state.landlordBank || '____'}`);
  lines.push(`· 계좌번호: ${state.landlordAccount || '____'}`);
  lines.push(`· 예금주: ${state.landlordName || '____'}`);
  lines.push(``);
  lines.push(`■ 특약 사항`);

  if (state.clausePet) lines.push(`· 애완동물 사육 및 실내 흡연은 금지합니다.`);
  if (state.clauseCondition) lines.push(`· 본 계약은 현 시설 상태를 확인 후 계약하는 것으로 합니다.`);
  if (isBizOft) {
    lines.push(`· 업무용 오피스텔로 전입신고가 불가합니다.`);
    lines.push(`· 세금계산서 발급이 가능합니다.`);
  }
  lines.push(``);
  lines.push(`■ 해약금 규정`);

/* =========================================================
   RENDER HELPERS
========================================================= */
function Toggle({ id, checked, onChange, label }) {
  return `
    <div style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="toggleClick('${id}')">
      <div class="toggle-track ${checked ? 'on' : ''}" id="track-${id}">
        <div class="toggle-thumb"></div>
      </div>
      <span style="font-size:14px;color:#dbe1fe;">${label}</span>
    </div>
  `;
}

function RadioPill(name, options, current) {
  return `<div class="radio-pill">` + options.map(o =>
    `<input type="radio" name="${name}" id="${name}_${o.value}" value="${o.value}" tabindex="-1" ${current === o.value ? 'checked' : ''} onchange="onRadio('${name}','${o.value}')">
     <label for="${name}_${o.value}">${o.label}</label>`
  ).join('') + `</div>`;
}

function Checkbox(id, checked, label) {
  return `
    <label class="chk">
      <input type="checkbox" tabindex="-1" ${checked ? 'checked' : ''} id="${id}" onchange="toggleCheck('${id}')">
      <div class="chk-box">
        <svg class="chk-mark" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="#241a00" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <span class="chk-label">${label}</span>
    </label>
  `;
}

/* =========================================================

========================================================= */
function renderIndicator() {
  const steps = ['매물', '조건', '특약', '미리보기'];
  const el = document.getElementById('step-indicator');
  el.innerHTML = steps.map((s, i) => {
    const n = i + 1;
    const cls = n === state.step ? 'active' : n < state.step ? 'done' : 'idle';
    const check = n < state.step ? '✓' : n;
    return `
      <div style="display:flex;align-items:center;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="step-dot ${cls}">${cls === 'done' ? '✓' : n}</div>
          <div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${cls === 'active' ? '#d4af37' : cls === 'done' ? '#d4af37' : '#4d4635'};">${s}</div>
        </div>
        ${i < steps.length - 1 ? `<div style="flex:1;height:1px;background:${state.step > n ? '#d4af37' : '#22293e'};margin:0 8px;min-width:30px;margin-bottom:16px;"></div>` : ''}
      </div>
    `;
  }).join('');
}

/* =========================================================
   EVENT HANDLERS (global)
========================================================= */
window.selectComplex = function(v) {
  state.complex = v;
  save();
  renderStep1();
};

window.toggleClick = function(id) {
  state[id] = !state[id];
  save();
  if (state.step === 2) renderStep2();
  if (state.step === 3) renderStep3();
};

window.toggleCheck = function(id) {
  state[id] = !state[id];
  save();
  renderStep3();
};

window.onRadio = function(name, value) {
  state[name] = value;
  save();
  if (state.step === 2) renderStep2();
};

window.onInput = function(key, value) {
  state[key] = value;
  save();
  // live preview for balance
  if (['contractMoney','todayDeposit','deposit','monthlyRent'].includes(key) && state.step === 2) {
    // update preview labels without full re-render
    const el = document.querySelector(`[oninput="onInput('${key}',this.value)"]`);
    if (el) {
      const preview = el.nextElementSibling;
      if (preview && preview.style.color === 'rgb(212, 175, 55)') {
        preview.textContent = formatMoney(value.replace(/,/g, ''));
      }
    }
    // update balance
    const { balance } = calcBalance();
    const balEl = document.querySelector('.balance-preview');
    if (balEl && balance > 0) balEl.textContent = formatMoney(String(balance));
    else if (balance <= 0 && balEl) balEl.textContent = '';
  }
};

window.autoComma = function(key, el) {
  const n = parseNum(el.value);
  if (!isNaN(n) && n > 0) {
    el.value = n.toLocaleString('ko-KR');
    state[key] = el.value;
    save();
    renderStep2();
  }
};

window.goStep = function(n) {
  document.querySelectorAll('.step-panel').forEach(p => p.style.display = 'none');
  state.step = n;
  save();
  renderIndicator();
  const panel = document.getElementById(`step-${n}`);
  panel.style.display = 'block';
  if (n === 1) renderStep1();
  if (n === 2) renderStep2();
  if (n === 3) renderStep3();
  if (n === 4) renderStep4();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.copyText = function() {
  const ta = document.getElementById('msg-edit');
  const text = ta ? ta.value : generateText();
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  });
};

  const ph = document.getElementById('hd-phone');
  const tt = document.getElementById('hd-title');
  if (nm) nm.textContent = agency.name;
  if (ph) ph.textContent = agency.phone;
  if (tt) tt.textContent = `${agency.name} 계약문자 생성기`;
  document.title = `${agency.name} · 계약문자 생성기`;
}

/* 설정 모달 */
window.openSettings = function() {
  document.getElementById('set-name').value = agency.name;
  document.getElementById('set-phone').value = agency.phone;
  const m = document.getElementById('settings-modal');
  m.style.display = 'flex';
  m.style.alignItems = 'center';
  m.style.justifyContent = 'center';
};
window.closeSettings = function() {
  document.getElementById('settings-modal').style.display = 'none';
};
window.saveAgencySettings = function() {
  const n = document.getElementById('set-name').value.trim();
  const p = document.getElementById('set-phone').value.trim();
  if (!n) { alert('부동산 이름을 입력해 주세요.'); return; }
  agency.name = n;
  agency.phone = p;
  saveAgency();
  renderHeader();
  closeSettings();
};

window.resetAll = function() {
  if (!confirm('모든 입력값을 초기화할까요?')) return;
  Object.assign(state, {
    step: 1,
    complex: '',
    buildingName: '',
    buildingDong: '',
    buildingHo: '',
    oftUse: '주거용',
    contractType: '전세',
    deposit: '',
    monthlyRent: '',
    monthlyType: '후불',
    vat: '별도',
    moveInDate: '',
    contractPeriod: '24',
    customPeriod: '',
    contractMoney: '',
    todayDeposit: '',
    coAgent: false,
    coAgentName: '',
    clausePet: true,
    clauseCondition: true,
    clauseBreak: true,
    landlordBank: '',
    landlordAccount: '',
    landlordName: '',
  });
  save();
  goStep(1);
};

/* =========================================================
   INIT
========================================================= */
(function init() {
  renderHeader();
  /* 첫 방문 시 부동산 정보 설정 유도 */
  if (!localStorage.getItem('haitop_agency')) {
    setTimeout(() => openSettings(), 400);
  }
  renderIndicator();
  // show correct step
  document.querySelectorAll('.step-panel').forEach(p => p.style.display = 'none');
  const panel = document.getElementById(`step-${state.step}`);
  panel.style.display = 'block';
  if (state.step === 1) renderStep1();
  if (state.step === 2) renderStep2();
  if (state.step === 3) renderStep3();
  if (state.step === 4) renderStep4();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  let _installPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _installPrompt = e;
    const btn = document.getElementById('install-btn');
    if (btn) btn.style.display = 'block';
  });
  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('install-btn');
    if (btn) btn.style.display = 'none';
    _installPrompt = null;
  });
  window.installApp = async function() {
    if (_installPrompt) {
      _installPrompt.prompt();
      const { outcome } = await _installPrompt.userChoice;
      if (outcome === 'accepted') _installPrompt = null;
    } else {
      alert('Safari라면: 하단 공유버튼 → "홈 화면에 추가"를 눌러주세요.');
    }
  };
</script>
</body>
</html>
