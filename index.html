<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>하이탑부동산 · 계약문자 생성기</title>
  <meta name="theme-color" content="#d4af37" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="계약문자" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              950: '#060d21',
              900: '#0b1227',
              800: '#141b2f',
              700: '#181f34',
              600: '#22293e',
              500: '#2d344a',
              400: '#32384f',
            },
            gold: {
              DEFAULT: '#d4af37',
              light: '#f2ca50',
              dim: '#e9c349',
            },
            surface: '#dbe1fe',
            muted: '#d0c5af',
          },
          fontFamily: { manrope: ['Manrope', 'sans-serif'] },
          borderRadius: { sm: '2px', DEFAULT: '4px', md: '4px', lg: '6px' },
        },
      },
    };
  </script>
  <style>
    * { font-family: 'Manrope', sans-serif; box-sizing: border-box; }
    body { background: #0b1227; color: #dbe1fe; min-height: 100vh; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0b1227; }
    ::-webkit-scrollbar-thumb { background: #2d344a; border-radius: 3px; }

    /* input / select base */
    .field {
      background: #060d21;
      border: 1px solid #2d344a;
      border-radius: 4px;
      color: #dbe1fe;
      padding: 10px 14px;
      width: 100%;
      font-size: 15px;
      transition: border-color .2s;
      outline: none;
    }
    .field:focus { border-color: #d4af37; }
    .field::placeholder { color: #4d4635; }

    select.field option { background: #181f34; }

    /* label */
    .label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #d0c5af;
      margin-bottom: 6px;
    }

    /* gold button */
    .btn-gold {
      background: #d4af37;
      color: #241a00;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .05em;
      padding: 12px 28px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn-gold:hover { background: #f2ca50; transform: translateY(-1px); }
    .btn-gold:active { transform: translateY(0); }

    /* ghost button */
    .btn-ghost {
      background: transparent;
      color: #d4af37;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: .05em;
      padding: 11px 24px;
      border-radius: 4px;
      border: 1px solid #d4af37;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-ghost:hover { background: rgba(212,175,55,.08); }

    /* reset button (헤더 하단, 전 단계 공통) */
    .btn-reset {
      background: transparent;
      border: 1px solid #4d4635;
      color: #99907c;
      font-weight: 600;
      font-size: 12px;
      padding: 7px 16px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;
      transition: border-color .2s, color .2s;
    }
    .btn-reset:hover { border-color: #d4af37; color: #d4af37; }

    /* card */
    .card {
      background: #141b2f;
      border: 1px solid #22293e;
      border-radius: 4px;
      padding: 24px;
    }

    /* toggle */
    .toggle-track {
      width: 44px; height: 24px;
      border-radius: 12px;
      background: #2d344a;
      position: relative;
      cursor: pointer;
      transition: background .2s;
      flex-shrink: 0;
    }
    .toggle-track.on { background: #d4af37; }
    .toggle-thumb {
      width: 18px; height: 18px;
      border-radius: 9px;
      background: #dbe1fe;
      position: absolute;
      top: 3px; left: 3px;
      transition: left .2s;
    }
    .toggle-track.on .toggle-thumb { left: 23px; background: #241a00; }

    /* step indicator */
    .step-dot {
      width: 32px; height: 32px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
    }
    .step-dot.active { background: #d4af37; color: #241a00; }
    .step-dot.done { background: #22293e; color: #d4af37; border: 1px solid #d4af37; }
    .step-dot.idle { background: #22293e; color: #4d4635; }

    /* checkbox */
    .chk { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
    .chk input[type=checkbox] { display: none; }
    .chk-box {
      width: 18px; height: 18px; flex-shrink: 0;
      border: 1px solid #4d4635;
      border-radius: 2px;
      background: #060d21;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px;
      transition: border-color .2s, background .2s;
    }
    .chk input:checked + .chk-box { background: #d4af37; border-color: #d4af37; }
    .chk-mark { width: 10px; height: 10px; fill: #241a00; display: none; }
    .chk input:checked + .chk-box .chk-mark { display: block; }
    .chk-label { font-size: 14px; color: #dbe1fe; line-height: 1.5; }

    /* messenger bubble */
    .bubble {
      background: #22293e;
      border: 1px solid #2d344a;
      border-radius: 4px 18px 18px 18px;
      padding: 16px 18px;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
      color: #dbe1fe;
      resize: vertical;
      min-height: 400px;
      width: 100%;
      outline: none;
    }
    .bubble:focus { border-color: #d4af37; }

    /* 계약내용 확인서 (문서형 뷰) - 흰 배경 문서 스타일, 다크 테마와 별도 */
    .doc-card {
      background: #ffffff;
      color: #1a2233;
      border-radius: 6px;
      padding: 28px 22px;
    }
    .doc-title {
      font-size: 19px;
      font-weight: 800;
      color: #0b1a3a;
      text-align: center;
      letter-spacing: .02em;
    }
    .doc-subtitle {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      margin-top: 4px;
    }
    .doc-meta {
      font-size: 11px;
      color: #9ca3af;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 18px;
    }
    /* 문자 원문 전체를 그대로 옮긴 문서 본문 줄 */
    .doc-line {
      font-size: 13.5px;
      line-height: 1.85;
      color: #1a2233;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .doc-line-heading {
      font-size: 14px;
      font-weight: 800;
      color: #0b1a3a;
      margin: 16px 0 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .doc-line-money {
      font-weight: 700;
      color: #92610a;
    }
    .doc-divider {
      border: none;
      border-top: 1px solid #d1d5db;
      margin: 16px 0;
    }

    /* radio pill */
    .radio-pill { display: flex; gap: 0; }
    .radio-pill label {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #2d344a;
      background: #060d21;
      color: #d0c5af;
      transition: background .15s, color .15s, border-color .15s;
    }
    .radio-pill label:first-child { border-radius: 4px 0 0 4px; }
    .radio-pill label:last-child { border-radius: 0 4px 4px 0; }
    .radio-pill input[type=radio] { display: none; }
    .radio-pill input:checked + label { background: #d4af37; color: #241a00; border-color: #d4af37; }

    /* divider */
    .divider { border: none; border-top: 1px solid #22293e; margin: 20px 0; }

    /* wizard 2-column layout (PC preview) */
    #wizard-layout { display: block; }
    @media (min-width: 900px) {
      #wizard-layout.has-preview {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 24px;
        align-items: start;
      }
    }

    /* copy toast */
    #toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #d4af37; color: #241a00;
      font-weight: 700; font-size: 14px;
      padding: 12px 28px; border-radius: 4px;
      transition: transform .3s ease;
      z-index: 999;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── 모바일 최적화 ── */
    @media (max-width: 600px) {
      /* iOS 줌 방지: input 폰트 16px 이상 */
      .field { font-size: 16px; padding: 13px 14px; }

      /* 터치 타겟 최소 44px */
      .btn-gold, .btn-ghost {
        min-height: 48px;
        padding: 14px 20px;
        font-size: 15px;
        width: 100%;
        justify-content: center;
      }

      /* 버튼 행: 세로 스택 */
      .btn-row {
        flex-direction: column !important;
        gap: 10px !important;
      }
      .btn-row .btn-ghost { order: 2; }
      .btn-row .btn-gold  { order: 1; }

      /* 카드 패딩 축소 */
      .card { padding: 16px; }

      /* radio pill 글씨 */
      .radio-pill label { font-size: 14px; padding: 11px 0; }

      /* 체크박스 터치 영역 */
      .chk { padding: 6px 0; }
      .chk-box { width: 22px; height: 22px; }

      /* 말풍선 */
      .bubble { font-size: 13px; min-height: 320px; }

      /* 헤더 */
      header { padding: 0; }

      /* safe area (iPhone 노치/홈바) */
      body { padding-bottom: env(safe-area-inset-bottom); }
      #toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
      main { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header style="border-bottom:1px solid #22293e; background:#060d21; position:sticky; top:0; z-index:50;">
  <div style="max-width:760px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:space-between;">
    <div>
      <div style="font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#d4af37;margin-bottom:2px;">REALTY</div>
      <div id="hd-name" onclick="goStep(1)" style="font-size:18px;font-weight:700;color:#dbe1fe;cursor:pointer;" title="처음으로">-</div>
      <div id="hd-title" style="font-size:12px;color:#d0c5af;margin-top:1px;">계약문자 생성기</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="hd-phone" style="font-size:12px;color:#4d4635;"></div>
      <button onclick="openSettings()"
        title="부동산 정보 설정"
        style="background:transparent;border:1px solid #2d344a;color:#d0c5af;font-size:12px;
               padding:5px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;">
        ⚙ <span style="font-size:11px;font-weight:600;letter-spacing:.03em;">설정변경</span>
      </button>
      <button id="install-btn" onclick="installApp()"
        style="display:none;background:rgba(212,175,55,.15);border:1px solid #d4af37;color:#d4af37;
               font-size:11px;font-weight:700;padding:6px 12px;border-radius:4px;cursor:pointer;
               letter-spacing:.05em;white-space:nowrap;">
        📱 앱 설치
      </button>
    </div>
  </div>
</header>

<!-- 설정 모달 -->
<div id="settings-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center;padding:24px;">
  <div style="background:#181f34;border:1px solid #d4af37;border-radius:6px;padding:28px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;position:relative;">
    <div style="font-size:16px;font-weight:700;color:#d4af37;margin-bottom:20px;">⚙ 부동산 정보 설정</div>
    <div style="margin-bottom:14px;">
      <label class="label">중개사무소 상호</label>
      <input class="field" id="set-name" type="text" placeholder="예: 하이탑부동산" />
    </div>
    <div style="margin-bottom:14px;">
      <label class="label">대표 공인중개사 성명</label>
      <input class="field" id="set-repname" type="text" placeholder="예: 주현희" />
    </div>
    <div style="margin-bottom:14px;">
      <label class="label">중개사무소 등록번호</label>
      <input class="field" id="set-license" type="text" placeholder="예: 12345-2024-00001" />
    </div>
    <div style="margin-bottom:14px;">
      <label class="label">사무소 주소</label>
      <input class="field" id="set-address" type="text" placeholder="예: 경기도 파주시 야당동 ..." />
    </div>
    <div style="margin-bottom:24px;">
      <label class="label">대표전화</label>
      <input class="field" id="set-phone" type="tel" placeholder="예: 031-949-8969" />
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-gold" style="flex:1;" onclick="saveAgencySettings()">저장</button>
      <button class="btn-ghost" style="flex:1;" onclick="closeSettings()">취소</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<main id="main-el" style="max-width:760px; margin:0 auto; padding:32px 24px 120px;">

  <!-- STEP INDICATOR -->
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:32px;">
    <div id="step-indicator" style="display:flex;align-items:center;gap:0;"></div>
    <button class="btn-reset" onclick="resetAll()" title="입력한 내용을 모두 초기화합니다">초기화</button>
  </div>

  <div id="wizard-layout">
    <div id="wizard-left">
      <!-- STEPS -->
      <div id="step-1" class="step-panel"></div>
      <div id="step-2" class="step-panel" style="display:none"></div>
      <div id="step-3" class="step-panel" style="display:none"></div>
      <div id="step-4" class="step-panel" style="display:none"></div>
    </div>
    <aside id="preview-panel" style="display:none;">
      <div class="card" style="position:sticky; top:88px;">
        <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#d4af37;margin-bottom:14px;">📋 실시간 미리보기</div>
        <div id="preview-content" style="font-size:13px;line-height:1.75;white-space:pre-wrap;color:#c7cee6;max-height:75vh;overflow-y:auto;"></div>
      </div>
    </aside>
  </div>

</main>

<!-- 앱 하단 제작자/저작권 표시 (모든 단계 공통, 자동생성 문구·확인서·이미지에는 포함되지 않음) -->
<footer style="text-align:center;padding:18px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid #22293e;">
  <div style="font-size:11px;color:#4d4635;line-height:1.6;word-break:keep-all;">부동산 계약문구 도우미 제공 · 하이탑부동산 | 문의 <a href="tel:0319498969" style="color:#4d4635;text-decoration:underline;">031-949-8969</a></div>
  <div style="font-size:11px;color:#4d4635;line-height:1.6;margin-top:2px;word-break:keep-all;">Copyright © 2026 하이탑부동산. All rights reserved.</div>
</footer>

<!-- TOAST -->
<div id="toast">✓ 문자가 복사되었습니다</div>

<script>
/* =========================================================
   STATE
========================================================= */
const state = {
  step: 1,
  complex: '',
  buildingName: '',   // 건물명 (일반 오피스텔/아파트)
  buildingDong: '',   // 동
  buildingHo: '',     // 호수
  contractType: '전세',
  deposit: '',
  monthlyRent: '',
  monthlyType: '후불',
  vat: '별도',
  moveInDate: '',
  contractPeriod: '24',
  customPeriod: '',
  contractMoney: '',
  contractMoneyManuallyEdited: false,
  todayDeposit: '',
  sendDate: getTodayKST(),
  contractSignDate: '',
  oftUse: '주거용',
  coAgent: false,
  coAgentName: '',
  coAgentPhone: '',
  clausePet: true,
  clauseCondition: true,
  clauseBreak: true,
  landlordBank: '',
  landlordAccount: '',
  landlordName: '',

  /* ── 매물 직접 입력 (신규) ── */
  propertyMode: 'select',        // 'select' | 'custom'
  customPropertyType: '아파트',   // '아파트' | '오피스텔'
  customAddress: '',

  /* ── 계좌정보 추후 안내 (신규) ── */
  accountLater: false,

  /* ── 자유 특약 (신규) ── */
  clauseFreeText: '',

  /* ── 공통 추가 특약 (신규) ── */
  clauseAsIs: false,
  clausePetBan: false,
  clauseSmokeBan: false,
  clauseRestore: false,
  clauseUtilSeparate: false,
  clauseLoanCoop: false,
  clauseNoRightsChange: false,
  clauseBrokerFeeOnBreach: true,

  /* ── 오피스텔 추가 특약 (신규) ── */
  clauseOftVatSeparate: false,
  clauseOftResidentCheck: false,
  clauseOftNoResident: false,
  clauseOftBizReg: false,
  clauseOftMgmtFeeCheck: false,
};

/* persist / load */
function save() { localStorage.setItem('haitop_state', JSON.stringify(state)); }
function load() {
  // 페이지를 열 때마다(최초 접속·새로고침 모두) 항상 1단계 빈 화면으로 시작한다.
  // haitop_state에 이전 계약 입력값이 남아 있어도 복원하지 않는다(의도적).
  // sendDate는 state 객체 리터럴의 기본값(getTodayKST())이 그대로 적용되어 오늘 날짜로 시작한다.
  // 부동산 설정정보(haitop_agency)는 loadAgency()에서 별도로 그대로 유지된다.
}
load();

/* 입력 검증 통과 후에만 오류 표시 */
let showErrors = false;

/* ── 부동산 정보 (별도 저장, 초기화해도 유지) ── */
const agency = {
  name: '하이탑부동산',
  repName: '주현희',
  licenseNumber: '',
  address: '',
  phone: '031-949-8969',
};
function loadAgency() {
  const a = localStorage.getItem('haitop_agency');
  if (a) Object.assign(agency, JSON.parse(a));
}
function saveAgency() { localStorage.setItem('haitop_agency', JSON.stringify(agency)); }
loadAgency();

/* =========================================================
   UTILS
========================================================= */
const COMPLEX_LIST = [
  { label: '힐스테이트더운정 (아파트)', value: 'hillstate_apt', type: 'apt', fixed: true },
  { label: '힐스테이트더운정 (오피스텔)', value: 'hillstate_oft', type: 'oft', fixed: true },
  { label: '오피스텔', value: 'oft', type: 'oft', fixed: false },
  { label: '아파트', value: 'apt', type: 'apt', fixed: false },
];

function isFixedComplex() {
  const c = COMPLEX_LIST.find(x => x.value === state.complex);
  return c && c.fixed;
}

/* 직접입력/기존단지 선택 모드에 따른 물건 유형 판별 */
function getPropertyType() {
  if (state.propertyMode === 'custom') {
    return state.customPropertyType === '오피스텔' ? 'oft' : 'apt';
  }
  const c = COMPLEX_LIST.find(x => x.value === state.complex);
  return c ? c.type : '';
}
function isOft() {
  return getPropertyType() === 'oft';
}
function isBusinessOft() {
  return isOft() && state.oftUse === '업무용';
}
/* 부가세 표시 조건: 업무용 오피스텔 월세일 때만 */
function showVat() {
  return state.contractType === '월세' && isBusinessOft();
}

/* 숫자 → 한국어 금액 */
function numToKorean(n) {
  if (!n || isNaN(n)) return '';
  const units = ['', '만', '억', '조'];
  let num = Math.abs(parseInt(n));
  if (num === 0) return '영';
  const ones = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
  const tens = ['', '십', '이십', '삼십', '사십', '오십', '육십', '칠십', '팔십', '구십'];
  const hundreds = ['', '백', '이백', '삼백', '사백', '오백', '육백', '칠백', '팔백', '구백'];
  const thousands = ['', '천', '이천', '삼천', '사천', '오천', '육천', '칠천', '팔천', '구천'];

  function block(b) {
    const t = Math.floor(b / 1000) % 10;
    const h = Math.floor(b / 100) % 10;
    const ten = Math.floor(b / 10) % 10;
    const o = b % 10;
    return (t ? thousands[t] : '') + (h ? hundreds[h] : '') + (ten ? tens[ten] : '') + (o ? ones[o] : '');
  }

  let result = '';
  const parts = [];
  let tmp = num;
  for (let i = 0; tmp > 0; i++) {
    const b = tmp % 10000;
    if (b > 0) parts.unshift({ val: b, unit: units[i] });
    tmp = Math.floor(tmp / 10000);
  }
  result = parts.map(p => block(p.val) + p.unit).join('');

  // 간단 표기: 만단위까지
  return result;
}

function formatMoney(raw) {
  if (!raw) return '';
  const n = parseInt(raw.replace(/,/g, ''));
  if (isNaN(n)) return '';
  const kor = numToKorean(n);
  const fmt = n.toLocaleString('ko-KR');
  return `금 ${kor}원 정(${fmt}원)`;
}

function fmtNum(raw) {
  if (!raw) return '';
  const n = parseInt(raw.replace(/,/g, ''));
  if (isNaN(n)) return '';
  return n.toLocaleString('ko-KR');
}

/* 확인서(문서형 뷰)용 금액 표기: "20,000,000원" */
function formatWon(raw) {
  const n = parseNum(raw);
  return n > 0 ? `${n.toLocaleString('ko-KR')}원` : '';
}

function parseNum(s) {
  if (!s) return 0;
  return parseInt(String(s).replace(/,/g, '')) || 0;
}

/* 보증금의 10%를 정수 금액으로 계산 (전체계약금 자동계산용) */
function calcAutoContractMoney(depositRaw) {
  const n = parseNum(depositRaw);
  if (!n) return '';
  return String(Math.round(n * 0.1));
}

/* 날짜 포맷 */
/* 한국시간(KST, UTC+9) 기준 오늘 날짜 (YYYY-MM-DD) — 기기 시간대와 무관하게 계산 */
function getTodayKST() {
  const now = new Date();
  const kst = new Date(now.getTime() + 9 * 60 * 60 * 1000);
  return kst.toISOString().split('T')[0];
}

function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${y}년 ${parseInt(m)}월 ${parseInt(day)}일`;
}

function fmtSendDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${y}.${m}.${day}`;
}

function fmtContractSignDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${y}.${parseInt(m)}.${parseInt(day)}일`;
}

/* 잔금일 계산: 이사 예정일 */
function calcBalance() {
  const deposit = parseNum(state.deposit);
  const today = parseNum(state.todayDeposit);
  const total = parseNum(state.contractMoney);
  const balance = total - today;
  return { balance, total };
}

/* 계약 기간 */
function getPeriod() {
  if (state.contractPeriod === '직접') return state.customPeriod + '개월';
  return state.contractPeriod + '개월';
}

/* 단지명 */
function getComplexLabel() {
  const c = COMPLEX_LIST.find(x => x.value === state.complex);
  return c ? c.label : '';
}

/* 동/호수 등 단위 접미사를 중복 없이 붙임 (예: "101" -> "101동", "101동" -> "101동" 그대로) */
function appendUnit(raw, unit) {
  const v = (raw || '').trim();
  if (!v) return '';
  return v.endsWith(unit) ? v : `${v}${unit}`;
}

/* 동·호수만 조합 (예: "101동 1203호", "1203호") - 동/호수 모두 없으면 빈 문자열 */
function getDongHoText() {
  const dongText = appendUnit(state.buildingDong, '동');
  const hoText = appendUnit(state.buildingHo, '호');
  return [dongText, hoText].filter(Boolean).join(' ');
}

/* 매물 표시 텍스트 (기존단지선택/직접입력 공통 진입점) */
function getPropertyDisplayText() {
  const bldgName = state.buildingName ? ` ${state.buildingName}` : '';
  const dongText = appendUnit(state.buildingDong, '동');
  const hoText = appendUnit(state.buildingHo, '호');
  const bldgDong = dongText ? ` ${dongText}` : '';
  const bldgHo = hoText ? ` ${hoText}` : '';
  const suffix = `${bldgName}${bldgDong}${bldgHo}`;
  const label = state.propertyMode === 'custom'
    ? (state.customPropertyType || '')
    : getComplexLabel();
  return `${label}${suffix}`;
}

/* 부동산 정보 설정(agency) 기반 표시 줄 목록 - 값이 없는 항목은 제외 */
function getAgencyInfoLines() {
  const lines = [];
  if (agency.name) lines.push(agency.name);
  if (agency.repName) lines.push(`대표 공인중개사: ${agency.repName}`);
  if (agency.licenseNumber) lines.push(`중개사무소 등록번호: ${agency.licenseNumber}`);
  if (agency.address) lines.push(`사무소 주소: ${agency.address}`);
  if (agency.phone) lines.push(`대표전화: ${agency.phone}`);
  return lines;
}

    if (state.clauseOftResidentCheck) list.push('주거용 전입신고 가능 여부는 사전에 확인해 주시기 바랍니다.');

  if (agencyInfoLines.length) {
    lines.push(``);
    lines.push(`────────────────`);
    agencyInfoLines.forEach(l => lines.push(l));
  }

  return lines.join('\n');
}

/* 미리보기 = 최종 결과와 동일한 생성 로직 사용 (중복 방지) */

  return generateText();

/* =========================================================
   VALIDATION (step2 → step3 이동 시)
========================================================= */
const FIELD_ORDER = [
  'property', 'buildingDong', 'buildingHo', 'contractType',
  'deposit', 'monthlyRent', 'contractMoney', 'todayDeposit',
  'moveInDate', 'contractSignDate',
  'landlordBank', 'landlordAccount', 'landlordName',
];

function validateStep2() {
  const errors = {};

  if (state.propertyMode === 'custom') {
    if (!state.customPropertyType) errors.property = '주택 유형을 선택해 주세요.';
    else if (!state.buildingName.trim()) errors.property = '단지명 또는 건물명을 입력해 주세요.';
  } else if (!state.complex) {
    errors.property = '단지를 선택해 주세요.';
  }

  if (!isOft() && !state.buildingDong.trim()) errors.buildingDong = '동을 입력해 주세요.';
  if (!state.buildingHo.trim()) errors.buildingHo = '호수를 입력해 주세요.';
  if (!state.contractType) errors.contractType = '계약 유형을 선택해 주세요.';
  if (!parseNum(state.deposit)) errors.deposit = '보증금을 입력해 주세요.';
  if (state.contractType === '월세' && !parseNum(state.monthlyRent)) errors.monthlyRent = '월세를 입력해 주세요.';
  if (!parseNum(state.contractMoney)) errors.contractMoney = '전체계약금을 입력해 주세요.';
  if (!parseNum(state.todayDeposit)) errors.todayDeposit = '금일 입금 계약금을 입력해 주세요.';
  if (!state.moveInDate) errors.moveInDate = '입주예정일을 선택해 주세요.';
  if (!state.contractSignDate) errors.contractSignDate = '계약서 작성일을 선택해 주세요.';

  if (!state.accountLater) {
    if (!state.landlordBank.trim()) errors.landlordBank = '은행명을 입력해 주세요.';
    if (!state.landlordAccount.trim()) errors.landlordAccount = '계좌번호를 입력해 주세요.';
    if (!state.landlordName.trim()) errors.landlordName = '예금주를 입력해 주세요.';
  }

  return errors;
}

/* 입력 중 실시간으로 해당 필드 오류만 갱신 (전체 재렌더 없이) */
function updateFieldError(key) {
  if (!showErrors) return;
  const errors = validateStep2();
  const errEl = document.getElementById(`err-${key}`);
  const inputEl = document.getElementById(`fld-${key}`);
  if (errEl) errEl.textContent = errors[key] ? `⚠ ${errors[key]}` : '';
  if (inputEl) inputEl.style.borderColor = errors[key] ? '#ff6b6b' : '';
}

function scrollToFirstError(errors) {
  const firstKey = FIELD_ORDER.find(k => errors[k]);
  if (!firstKey) return;
  const el = document.getElementById(`fld-${firstKey}`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (el.focus) el.focus();
  }
}

window.tryProceedToStep3 = function() {
  const errors = validateStep2();
  if (Object.keys(errors).length > 0) {
    showErrors = true;
    renderStep2();
    scrollToFirstError(errors);
    return;
  }
  showErrors = false;
  goStep(3);
};

/* =========================================================
   PC 실시간 미리보기 패널 (900px 이상)
========================================================= */
function updatePreview() {
  const el = document.getElementById('preview-content');
  if (!el) return;
  el.textContent = getPreviewText();
}

function updateLayout() {
  const layout = document.getElementById('wizard-layout');
  const panel = document.getElementById('preview-panel');
  const mainEl = document.getElementById('main-el');
  if (!layout || !panel || !mainEl) return;
  const showPreview = window.innerWidth >= 900 && state.step !== 4;
  if (showPreview) {
    layout.classList.add('has-preview');
    panel.style.display = 'block';
    mainEl.style.maxWidth = '1180px';
    updatePreview();
  } else {
    layout.classList.remove('has-preview');
    panel.style.display = 'none';
    mainEl.style.maxWidth = '760px';
  }
}
window.addEventListener('resize', updateLayout);
if (window.matchMedia) {
  const mq = window.matchMedia('(min-width: 900px)');
  if (mq.addEventListener) mq.addEventListener('change', updateLayout);
  else if (mq.addListener) mq.addListener(updateLayout); // 구형 브라우저 대응
}

/* =========================================================
   RENDER HELPERS
========================================================= */
function Toggle({ id, checked, onChange, label }) {
  return `
    <div style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="toggleClick('${id}')">
      <div class="toggle-track ${checked ? 'on' : ''}" id="track-${id}">
        <div class="toggle-thumb"></div>
      </div>
      <span style="font-size:14px;color:#dbe1fe;">${label}</span>
    </div>
  `;
}

function RadioPill(name, options, current) {
  return `<div class="radio-pill">` + options.map(o =>
    `<input type="radio" name="${name}" id="${name}_${o.value}" value="${o.value}" tabindex="-1" ${current === o.value ? 'checked' : ''} onchange="onRadio('${name}','${o.value}')">
     <label for="${name}_${o.value}">${o.label}</label>`
  ).join('') + `</div>`;
}

function Checkbox(id, checked, label) {
  return `
    <label class="chk">
      <input type="checkbox" tabindex="-1" ${checked ? 'checked' : ''} id="${id}" onchange="toggleCheck('${id}')">
      <div class="chk-box">
        <svg class="chk-mark" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" fill="none" stroke="#241a00" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <span class="chk-label">${label}</span>
    </label>
  `;
}

/* =========================================================
   STEP RENDERS
========================================================= */
function renderIndicator() {
  const steps = ['매물', '조건', '특약', '미리보기'];
  const el = document.getElementById('step-indicator');
  el.innerHTML = steps.map((s, i) => {
    const n = i + 1;
    const cls = n === state.step ? 'active' : n < state.step ? 'done' : 'idle';
    const check = n < state.step ? '✓' : n;
    return `
      <div style="display:flex;align-items:center;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="step-dot ${cls}">${cls === 'done' ? '✓' : n}</div>
          <div style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:${cls === 'active' ? '#d4af37' : cls === 'done' ? '#d4af37' : '#4d4635'};">${s}</div>
        </div>
        ${i < steps.length - 1 ? `<div style="flex:1;height:1px;background:${state.step > n ? '#d4af37' : '#22293e'};margin:0 8px;min-width:30px;margin-bottom:16px;"></div>` : ''}
      </div>
    `;
  }).join('');
}

        ${Checkbox('clauseOftMgmtFeeCheck', state.clauseOftMgmtFeeCheck, '관리비 부과 기준 확인')}
      </div>
      ` : ''}
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div style="font-size:13px;font-weight:700;color:#d4af37;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;">기타 특약사항</div>
      <textarea class="field" id="fld-clauseFreeText" rows="4" style="resize:vertical;min-height:96px;line-height:1.6;"
        placeholder="자유롭게 특약사항을 입력해 주세요. (여러 줄 입력 가능, 비워두면 최종 문자에 포함되지 않습니다)"
        oninput="onInput('clauseFreeText',this.value)">${state.clauseFreeText}</textarea>
    </div>

    <div style="display:flex;justify-content:space-between;margin-top:32px;" class="btn-row">
      <button class="btn-ghost" onclick="goStep(2)">&larr; 이전</button>
      <button class="btn-gold" onclick="goStep(4)">문자 생성 ✦</button>
    </div>
  `;
  updatePreview();
}

/* HTML 특수문자 이스케이프 (문자 원문을 그대로 문서에 옮길 때 마크업 깨짐 방지) */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* generateText() 전체 원문을 줄 단위로 문서형 HTML로 변환 (■ 제목, 구분선, 금액 줄만 가볍게 강조) */
function renderDocumentBodyHTML(text) {
  return text.split('\n').map(line => {
    const trimmed = line.trim();
    if (!trimmed) return `<div style="height:10px;"></div>`;
    if (trimmed.startsWith('■')) {
      return `<div class="doc-line-heading">${escapeHtml(line)}</div>`;
    }
    if (/^─{3,}$/.test(trimmed)) {
      return `<hr class="doc-divider">`;
    }
    const isMoneyLine = /[0-9][0-9,]*원/.test(trimmed);
    return `<div class="doc-line${isMoneyLine ? ' doc-line-money' : ''}">${escapeHtml(line)}</div>`;
  }).join('');
}

/* 부동산 계약내용 확인서 (문서형 뷰) HTML 생성 - generateText() 전체 원문을 단일 원본으로 사용.
   결과 화면(view)과 이미지 저장이 공통으로 사용하며, 문자 복사도 동일한 text를 사용한다. */
function buildDocumentCardHTML(text) {
  return `
    <div id="doc-card" class="doc-card">
      <div class="doc-title">부동산 계약내용 확인서</div>
      <div class="doc-subtitle">아래 계약조건을 확인해 주시기 바랍니다.</div>
      <div class="doc-meta">생성일자: ${fmtDate(state.sendDate)}</div>
      ${renderDocumentBodyHTML(text)}
    </div>
  `;
}

/* --- STEP 4 --- */
/* step4는 문서형 화면(view)과 원문 수정 화면(edit) 두 가지 모드를 가진다.
   step4EditedText가 null이 아니면 사용자가 직접 수정한 원문을 우선 사용하며,
   문자 복사와 이미지 저장 모두 이 함수가 반환하는 동일한 텍스트를 기준으로 동작한다. */
let step4Mode = 'view';
let step4EditedText = null;
function getStep4Text() {
  return step4EditedText !== null ? step4EditedText : generateText();
}

function renderStep4() {
  if (step4Mode === 'edit') { renderStep4Edit(); return; }
  renderStep4View();
}

function renderStep4View() {
  const txt = getStep4Text();
  document.getElementById('step-4').innerHTML = `
    <div style="margin-bottom:16px;">
      <div style="font-size:22px;font-weight:700;color:#dbe1fe;margin-bottom:6px;">계약내용 확인서</div>
      <div style="font-size:13px;color:#d0c5af;">문자 원문 전체가 아래 확인서에 그대로 표시됩니다.</div>
      <button type="button" onclick="goStep(3)" style="margin-top:12px;background:transparent;border:none;color:#d4af37;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;">&larr; 이전 단계로</button>
    </div>

    <!-- 문서형 확인서 (문자 원문 전체) -->
    <div style="border-radius:8px;overflow:hidden;margin-bottom:16px;">
      ${buildDocumentCardHTML(txt)}
    </div>

    <div style="display:flex;gap:10px;margin-bottom:10px;" class="btn-row">
      <button class="btn-gold" style="flex:1;" onclick="copyText()">📋 문자 복사</button>
      <button class="btn-gold" style="flex:1;" onclick="saveAsImage()">🖼 이미지로 저장</button>
    </div>
    <div style="display:flex;gap:10px;" class="btn-row">
      <button class="btn-ghost" style="flex:1;" onclick="enterStep4EditMode()">✏ 수정하기</button>
      <button class="btn-ghost" style="flex:1;border-color:#4d4635;color:#4d4635;" onclick="resetAll()">초기화</button>
    </div>
  `;
}

function renderStep4Edit() {
  const txt = getStep4Text();
  document.getElementById('step-4').innerHTML = `
    <div style="margin-bottom:16px;">
      <div style="font-size:22px;font-weight:700;color:#dbe1fe;margin-bottom:6px;">문자 원문 수정</div>
      <div style="font-size:13px;color:#d0c5af;">내용을 수정한 뒤 완료를 누르면 확인서에 반영됩니다.</div>
    </div>

    <textarea id="step4-edit-textarea" class="bubble" style="min-height:480px;">${txt}</textarea>
    <div id="charcount" style="text-align:right;font-size:12px;color:#4d4635;margin:8px 0 16px;"></div>

    <div style="display:flex;gap:10px;" class="btn-row">
      <button class="btn-ghost" style="flex:1;" onclick="cancelStep4Edit()">취소</button>
      <button class="btn-gold" style="flex:1;" onclick="finishStep4Edit()">완료</button>
    </div>
  `;

  const ta = document.getElementById('step4-edit-textarea');
  function updateCount() {
    document.getElementById('charcount').textContent = `${ta.value.length}자`;
  }
  ta.addEventListener('input', updateCount);
  updateCount();
}

window.enterStep4EditMode = function() {
  step4Mode = 'edit';
  renderStep4();
};
window.cancelStep4Edit = function() {
  step4Mode = 'view';
  renderStep4();
};
window.finishStep4Edit = function() {
  const ta = document.getElementById('step4-edit-textarea');
  step4EditedText = ta.value;
  step4Mode = 'view';
  renderStep4();
};

/* =========================================================
   EVENT HANDLERS (global)
========================================================= */
window.selectComplex = function(v) {
  state.complex = v;
  save();
  renderStep1();
  updatePreview();
};

window.toggleClick = function(id) {
  state[id] = !state[id];
  save();
  if (state.step === 1) renderStep1();
  if (state.step === 2) renderStep2();
  if (state.step === 3) renderStep3();
  updatePreview();
};

window.toggleCheck = function(id) {
  state[id] = !state[id];
  save();
  if (state.step === 1) renderStep1();
  if (state.step === 2) renderStep2();
  if (state.step === 3) renderStep3();
  updatePreview();
};

window.onRadio = function(name, value) {
  state[name] = value;
  save();
  if (state.step === 1) renderStep1();
  if (state.step === 2) renderStep2();
  updatePreview();
};

window.onInput = function(key, value) {
  state[key] = value;

  // 전체계약금을 사용자가 직접 입력하면 '직접 수정됨' 상태로 전환 (이후 보증금 변경 시 덮어쓰지 않음)
  if (key === 'contractMoney') {
    state.contractMoneyManuallyEdited = true;
  }
  // 보증금 변경 시, 전체계약금이 아직 자동값(직접 수정되지 않음) 상태라면 10%로 자동 재계산
  if (key === 'deposit' && !state.contractMoneyManuallyEdited) {
    state.contractMoney = calcAutoContractMoney(value);
  }

  save();
  // live preview for balance
  if (['contractMoney','todayDeposit','deposit','monthlyRent'].includes(key) && state.step === 2) {
    // update preview labels without full re-render
    const el = document.querySelector(`[oninput="onInput('${key}',this.value)"]`);
    if (el) {
      const preview = el.nextElementSibling;
      if (preview && preview.style.color === 'rgb(212, 175, 55)') {
        preview.textContent = formatMoney(value.replace(/,/g, ''));
      }
    }
    // 전체계약금 자동 재계산 결과를 입력칸/미리보기에 즉시 반영 (보증금 입력 중 포커스는 유지)
    if (key === 'deposit' && !state.contractMoneyManuallyEdited) {
      const cmInput = document.getElementById('fld-contractMoney');
      if (cmInput) {
        cmInput.value = state.contractMoney ? parseNum(state.contractMoney).toLocaleString('ko-KR') : '';
        const cmPreview = cmInput.nextElementSibling;
        if (cmPreview) cmPreview.textContent = formatMoney(state.contractMoney);
      }
    }
    if (key === 'contractMoney') {
      const cmStatus = document.getElementById('contractMoney-status');
      if (cmStatus) cmStatus.textContent = '직접 수정됨';
    }
    // update balance
    const { balance } = calcBalance();
    const balEl = document.querySelector('.balance-preview');
    if (balEl && balance > 0) balEl.textContent = formatMoney(String(balance));
    else if (balance <= 0 && balEl) balEl.textContent = '';
  }
  updateFieldError(key);
  updatePreview();
  // 매물 직접입력(동/호수/건물명) 변경 시 step1 다음 버튼 활성화 조건만 갱신 (전체 재렌더 없이 - 포커스 유지)
  if (state.step === 1 && ['buildingName','buildingDong','buildingHo'].includes(key)) {
    const dongOk = isOft() || state.buildingDong.trim();
    const customValid = !!(state.customPropertyType && state.buildingName.trim() && dongOk && state.buildingHo.trim());
    const nextDisabled = state.propertyMode === 'custom' ? !customValid : !state.complex;
    const btn = document.querySelector('#step-1 .btn-gold');
    if (btn) {
      btn.disabled = nextDisabled;
      btn.style.opacity = nextDisabled ? '.4' : '';
      btn.style.cursor = nextDisabled ? 'not-allowed' : '';
    }
  }
};

window.autoComma = function(key, el) {
  const n = parseNum(el.value);
  if (!isNaN(n) && n > 0) {
    el.value = n.toLocaleString('ko-KR');
    state[key] = el.value;
    save();
    renderStep2();
  }
  updatePreview();
};

/* 전체계약금을 보증금의 10%로 다시 계산 (직접수정 상태 해제) */
window.recalcContractMoney = function() {
  state.contractMoneyManuallyEdited = false;
  state.contractMoney = calcAutoContractMoney(state.deposit);
  save();
  renderStep2();
  updatePreview();
};

window.goStep = function(n) {
  document.querySelectorAll('.step-panel').forEach(p => p.style.display = 'none');
  state.step = n;
  save();
  renderIndicator();
  const panel = document.getElementById(`step-${n}`);
  panel.style.display = 'block';
  if (n === 1) renderStep1();
  if (n === 2) renderStep2();
  if (n === 3) renderStep3();
  if (n === 4) {
    // step4에 새로 진입할 때마다 수정 상태를 초기화하고 최신 내용으로 문서를 다시 생성한다.
    step4Mode = 'view';
    step4EditedText = null;
    renderStep4();
  }
  updateLayout();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.copyText = function() {
  const text = getStep4Text();
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  });
};

/* 파일명에 쓸 수 없는 문자 제거 (Windows/Mac 공통 금지문자 + 공백 정리) */
function sanitizeFileNamePart(s) {
  return (s || '').replace(/[\\/:*?"<>|]/g, '').trim();
}

/* 계약내용 확인서(#doc-card)만 이미지로 캡처해 다운로드 - 버튼/입력창은 포함되지 않음 */
window.saveAsImage = async function() {
  const node = document.getElementById('doc-card');
  if (!node || typeof html2canvas === 'undefined') {
    alert('이미지 저장 기능을 사용할 수 없습니다. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.');
    return;
  }
  try {
    const canvas = await html2canvas(node, { backgroundColor: '#ffffff', scale: 2, useCORS: true });
    const link = document.createElement('a');
    const namePart = sanitizeFileNamePart(agency.name) || '부동산';
    const dateForFile = (state.sendDate || '').replace(/-/g, '');
    link.download = `${namePart}_계약내용확인서_${dateForFile || 'image'}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (e) {
    alert('이미지 저장 중 오류가 발생했습니다. 다시 시도해 주세요.');
  }
};

/* 헤더 텍스트 갱신 */
function renderHeader() {
  const nm = document.getElementById('hd-name');
  const ph = document.getElementById('hd-phone');
  const tt = document.getElementById('hd-title');
  if (nm) nm.textContent = agency.name;
  if (ph) ph.textContent = agency.phone;
  if (tt) tt.textContent = `${agency.name} 계약문자 생성기`;
  document.title = `${agency.name} · 계약문자 생성기`;
}

/* 설정 모달 */
window.openSettings = function() {
  document.getElementById('set-name').value = agency.name;
  document.getElementById('set-repname').value = agency.repName;
  document.getElementById('set-license').value = agency.licenseNumber;
  document.getElementById('set-address').value = agency.address;
  document.getElementById('set-phone').value = agency.phone;
  const m = document.getElementById('settings-modal');
  m.style.display = 'flex';
  m.style.alignItems = 'center';
  m.style.justifyContent = 'center';
};
window.closeSettings = function() {
  document.getElementById('settings-modal').style.display = 'none';
};
window.saveAgencySettings = function() {
  const n = document.getElementById('set-name').value.trim();
  const rn = document.getElementById('set-repname').value.trim();
  const lic = document.getElementById('set-license').value.trim();
  const addr = document.getElementById('set-address').value.trim();
  const p = document.getElementById('set-phone').value.trim();
  if (!n) { alert('부동산 이름을 입력해 주세요.'); return; }
  agency.name = n;
  agency.repName = rn;
  agency.licenseNumber = lic;
  agency.address = addr;
  agency.phone = p;
  saveAgency();
  renderHeader();
  closeSettings();
};

window.resetAll = function() {
  if (!confirm('현재 입력한 내용을 모두 초기화하시겠습니까?')) return;
  Object.assign(state, {
    step: 1,
    complex: '',
    buildingName: '',
    buildingDong: '',
    buildingHo: '',
    oftUse: '주거용',
    contractType: '전세',
    deposit: '',
    monthlyRent: '',
    monthlyType: '후불',
    vat: '별도',
    moveInDate: '',
    contractPeriod: '24',
    customPeriod: '',
    contractMoney: '',
    contractMoneyManuallyEdited: false,
    todayDeposit: '',
    sendDate: getTodayKST(),
    contractSignDate: '',
    coAgent: false,
    coAgentName: '',
    coAgentPhone: '',
    clausePet: true,
    clauseCondition: true,
    clauseBreak: true,
    landlordBank: '',
    landlordAccount: '',
    landlordName: '',

    propertyMode: 'select',
    customPropertyType: '아파트',
    customAddress: '',
    accountLater: false,
    clauseFreeText: '',
    clauseAsIs: false,
    clausePetBan: false,
    clauseSmokeBan: false,
    clauseRestore: false,
    clauseUtilSeparate: false,
    clauseLoanCoop: false,
    clauseNoRightsChange: false,
    clauseBrokerFeeOnBreach: true,
    clauseOftVatSeparate: false,

    clauseOftNoResident: false,

  });

/* =========================================================
   INIT
========================================================= */
(function init() {
  renderHeader();
  /* 첫 방문 시 부동산 정보 설정 유도 */
  if (!localStorage.getItem('haitop_agency')) {
    setTimeout(() => openSettings(), 400);
  }
  renderIndicator();
  // show correct step
  document.querySelectorAll('.step-panel').forEach(p => p.style.display = 'none');
  const panel = document.getElementById(`step-${state.step}`);
  panel.style.display = 'block';
  if (state.step === 1) renderStep1();
  if (state.step === 2) renderStep2();
  if (state.step === 3) renderStep3();
  if (state.step === 4) renderStep4();
  updateLayout();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }

  let _installPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _installPrompt = e;
    const btn = document.getElementById('install-btn');
    if (btn) btn.style.display = 'block';
  });
  window.addEventListener('appinstalled', () => {
    const btn = document.getElementById('install-btn');
    if (btn) btn.style.display = 'none';
    _installPrompt = null;
  });
  window.installApp = async function() {
    if (_installPrompt) {
      _installPrompt.prompt();
      const { outcome } = await _installPrompt.userChoice;
      if (outcome === 'accepted') _installPrompt = null;
    } else {
      alert('Safari라면: 하단 공유버튼 → "홈 화면에 추가"를 눌러주세요.');
    }
  };
</script>
